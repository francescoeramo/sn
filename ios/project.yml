name: SN
options:
  bundleIdPrefix: it.sn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SN:
    type: application
    platform: iOS
    sources:
      - path: SN
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.sn.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SN/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
  SNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SNTests
    dependencies:
      - target: SN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.sn.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SN:
    build:
      targets:
        SN: all
        SNTests: [test]
    test:
      targets:
        - SNTests
